name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 2 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --all-targets

      # Enforces the 90 % line/function baseline on the unit-testable scope only
      # (src/core/ and src/platform/), per design D6 / coverage-baseline spec.
      # The regex is separator-agnostic because llvm-cov emits backslash paths on
      # Windows; the excluded set is identical to the documented capture scope:
      # src/main.rs, src/lib.rs and src/ui/**. The gate fails the job when the
      # scoped coverage drops below 90 %.
      - name: Run coverage
        env:
          LLVM_COV_FLAGS: '-ignore-filename-regex=(^|[\\/])src[\\/]((main|lib)\.rs|ui[\\/])'
        run: cargo llvm-cov --lcov --output-path coverage/lcov.info --fail-under-lines 90 --fail-under-functions 90

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}
          path: coverage/lcov.info
          if-no-files-found: warn

      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.23.0

      - name: Run cargo audit
        run: cargo audit

      - name: Install cargo-deny
        run: cargo install cargo-deny --version 0.20.2

      - name: Run cargo deny check
        run: cargo deny check
