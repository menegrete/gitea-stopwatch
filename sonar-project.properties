# SonarQube configuration generated by nsoft-specboot.
# Replace the placeholders below with your project details before scanning.
#
# Universal src/ + test/ convention: every application type keeps its
# analyzable sources under `src/` and its tests under `test/`, matching the
# `sonar.sources=src` / `sonar.tests=test` separation consumed by
# `nsoft-specboot scan`.
sonar.projectKey=gitea-stopwatch
sonar.projectName=gitea-stopwatch
sonar.projectVersion=${projectVersion}
sonar.sourceEncoding=UTF-8

# <!-- specboot:sonar-properties:start -->
# Rust desktop: the scan recipe analyzes src/ with the native Rust analyzer, which reads
# Rust sources under src/ and tests under tests/, writes coverage/lcov.info through
# `cargo llvm-cov --lcov --output-path coverage/lcov.info`, and imports the report
# `cargo clippy --all-targets --message-format=json` writes to target/clippy-report.json.
# The build output is excluded: `target/` is cargo's own directory.
sonar.sources=src
sonar.tests=tests
sonar.test.inclusions=tests/**/*.rs
sonar.exclusions=target/**
sonar.rust.lcov.reportPaths=coverage/lcov.info
sonar.rust.clippyReport.reportPaths=target/clippy-report.json
<!-- specboot:sonar-properties:end -->
