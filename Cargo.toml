[package]
name = "gitea-stopwatch"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
dirs = "5"
# `tokio` enables iced's timer executor, which the running instance uses to poll
# for focus requests left by a second launch (`iced::time::every`).
iced = { version = "0.14", features = ["tokio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Process-table lookup for orphan single-instance-lock recovery; `system` is the
# only feature needed (process listing), so the disk/network/GPU surfaces stay out.
sysinfo = { version = "0.40.3", default-features = false, features = ["system"] }
thiserror = "1"
# `tracing` facade only: the rolling-file subscriber lives in
# `platform::logging` so the log stays a bounded local file.
tracing = "0.1"

# Release build: explicit, reproducible settings rather than relying on the
# defaults. Thin LTO plus one codegen unit favours the shipped binary size and
# runtime over build time, and stripping symbols is safe because the panic hook
# in `platform::logging` records the panic location and payload from
# `PanicHookInfo` (compile-time file/line data) and never resolves symbols.
#
# `panic = "abort"` is deliberately NOT set: the panic hook writes the panic
# record to the rolling log before the process unwinds, the in-module tests and
# `tests/e2e.rs` rely on `std::panic::catch_unwind`, and aborting would make
# release behaviour diverge from the debug profile all gates run under.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"

# Coverage builds: `cargo llvm-cov` recompiles the crate with
# `-C instrument-coverage`, which layers coverage counters and mappings on top
# of the debug sections. At the `debug = 2` default the final link of the `e2e`
# target (and of the shipped binary it spawns) is rejected or crashes inside
# `rust-lld` (`.debug_str): offset ... is outside the section`,
# `relocation R_X86_64_32 out of range`, or a linker SIGSEGV). Line tables are
# all `llvm-cov` needs to map counters back to source lines, and the setting
# reaches the whole dependency graph, which is where most of the debug volume
# comes from. The trade-off is deliberate and bounded: `cargo run` builds keep
# breakpoints and line stepping, they only lose local-variable debug info.
# `incremental = false` keeps instrumented builds reproducible, because the
# incremental units of an `-C instrument-coverage` crate are large and can reuse
# stale coverage mappings across rebuilds.
[profile.dev]
debug = "line-tables-only"
incremental = false

# `test` inherits `dev`, but both keys are restated explicitly: the coverage
# recipe compiles the unit and `e2e` test targets under this profile, and
# stating the same flags on both profiles keeps a single `target/` directory
# from holding artifacts built with two different debug levels.
[profile.test]
debug = "line-tables-only"
incremental = false
