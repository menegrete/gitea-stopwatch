[package]
name = "gitea-stopwatch"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
dirs = "5"
# `tokio` enables iced's timer executor, which the running instance uses to poll
# for focus requests left by a second launch (`iced::time::every`).
iced = { version = "0.14", features = ["tokio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Process-table lookup for orphan single-instance-lock recovery; `system` is the
# only feature needed (process listing), so the disk/network/GPU surfaces stay out.
sysinfo = { version = "0.40.3", default-features = false, features = ["system"] }
thiserror = "1"
# `tracing` facade only: the rolling-file subscriber lives in
# `platform::logging` so the log stays a bounded local file.
tracing = "0.1"
